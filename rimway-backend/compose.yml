services:
  postgres:
    image: postgres:16-alpine
    container_name: rimway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rimway
      POSTGRES_PASSWORD: rimway_dev_password
      POSTGRES_DB: rimway
    ports:
      - "5432:5432"
    volumes:
      - rimway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rimway -d rimway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rimway-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rimway_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rimway_postgres_data:
  rimway_redis_data:
