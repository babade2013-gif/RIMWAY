name: rimway_app
description: RIM WAY Flutter Application
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.1
  dio: ^5.3.3
  socket_io_client: ^2.0.3
  flutter_secure_storage: ^9.0.0
  equatable: ^2.0.5
  shared_preferences: ^2.2.2
  geolocator: ^13.0.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.24.0
  mocktail: ^1.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/rimway_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0D1B3E"
  adaptive_icon_foreground: "assets/rimway_icon.png"
flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/rimway_icon.png
